name: Build PerAppSpoof APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  # Nama zip di root repo. Jika tidak ketemu, dipakai file .zip pertama di root.
  ZIP_FILE: PerAppSpoof-LSPosed2.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak zip
        id: extract
        run: |
          set -euo pipefail
          ZIP="$ZIP_FILE"
          if [ ! -f "$ZIP" ]; then
            ZIP="$(ls -1 ./*.zip 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Tidak ada file .zip di root repo"
            exit 1
          fi
          echo "Zip: $ZIP"

          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src

          # Cari folder proyek (yang berisi settings.gradle), baik zip berisi folder induk maupun tidak
          SETTINGS="$(find _src -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' | head -n1 || true)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle tidak ditemukan di dalam zip"
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Proyek: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan Xposed API 82
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          mkdir -p app/libs
          if [ -s "$GITHUB_WORKSPACE/api-82.jar" ]; then
            echo "Pakai api-82.jar dari root repo"
            cp "$GITHUB_WORKSPACE/api-82.jar" app/libs/api-82.jar
          else
            curl -fL --retry 3 --retry-delay 5 -o app/libs/api-82.jar \
              https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar \
              || echo "::warning::Unduh api-82.jar gagal, Gradle akan coba lewat repo Maven"
          fi
          # Jar kosong/rusak dihapus supaya build.gradle jatuh ke jalur Maven
          [ -s app/libs/api-82.jar ] || rm -f app/libs/api-82.jar
          ls -l app/libs || true

      - name: Build APK (debug)
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Kumpulkan APK
        id: collect
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(ls -1 app/build/outputs/apk/debug/*.apk | head -n1)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/PerAppSpoof-debug.apk"
          ls -l "$GITHUB_WORKSPACE/out"
          sha256sum "$GITHUB_WORKSPACE/out/PerAppSpoof-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerAppSpoof-debug-apk
          path: out/PerAppSpoof-debug.apk
          if-no-files-found: error
